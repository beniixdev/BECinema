<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BECinema - Foglalások</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">

</head>

<body>
    <div class="container mt-5">
        <h1 class="mb-4">Foglalások</h1>
        <div class="mb-3">
            <button id="tablaGomb" class="btn btn-primary" onclick="tablazatosNezet()">
                Táblázatos nézet
            </button>

            <button id="kartyaGomb" class="btn btn-outline-primary" onclick="kartyasNezet()">
                Kártyás nézet
            </button>
        </div>
        <div id="tablazatosNezet">
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Név</th>
                        <th>Film</th>
                        <th>Időpont</th>
                        <th>Ülőhely</th>
                        <th>Ár</th>
                        <th>Művelet</th>
                    </tr>
                </thead>

                <tbody id="foglalasTabla"></tbody>
            </table>
        </div>
        <div id="kartyasNezet" class="row" style="display: none;"></div>
    </div>
    <script src="./foglalasok.js"></script>
</body>

</html>
