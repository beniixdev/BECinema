<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BECinema - Foglalások</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="./index.html">BECinema</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="./index.html">Főoldal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./filmek.html">Filmek</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="./foglalasok.html">Foglalások</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="mb-4">FOGLALÁSOK</h1>

        <div class="nezet-gombok">
            <div>
                <button id="tablaGomb" class="nezet-gomb aktiv" onclick="tablazatosNezet()">
                    Táblázatos nézet
                </button>

                <button id="kartyaGomb" class="nezet-gomb" onclick="kartyasNezet()">
                    Kártyás nézet
                </button>
            </div>

            <button id="ujFoglalasGomb" class="uj-foglalas-gomb" onclick="ujFoglalasMutat()">
                + Új foglalás
            </button>
        </div>

        <div class="szures-doboz">
            <input type="text" id="nevKereses" class="form-control"
                placeholder="Keresés név alapján"
                oninput="foglalasokSzurese()">

            <select id="filmSzures" class="form-select" onchange="foglalasokSzurese()">
                <option value="">Összes film</option>
            </select>
        </div>

        <div id="ujFoglalasDoboz">
            <h2>Új foglalás</h2>

            <form id="foglalasForm">
                <div class="mb-3">
                    <label class="form-label">Név</label>
                    <input type="text" id="nev" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Telefonszám</label>
                    <input type="text" id="telefon" class="form-control" placeholder="06301234567">
                </div>

                <div class="mb-3">
                    <label class="form-label">Film</label>

                    <select id="film" class="form-select" required>
                        <option value="">Válassz filmet</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Időpont</label>

                    <select id="idopont" class="form-select" required>
                        <option value="">Először válassz filmet</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Jegyek száma</label>

                    <select id="jegyekSzama" class="form-select">
                        <option value="1">1 jegy</option>
                        <option value="2">2 jegy</option>
                        <option value="3">3 jegy</option>
                        <option value="4">4 jegy</option>
                        <option value="5">5 jegy</option>
                        <option value="6">6 jegy</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ülőhelyek</label>

                    <p id="helyInfo">
                        Válaszd ki a filmet és az időpontot.
                    </p>

                    <div id="vaszon">VÁSZON</div>
                    <div id="ulohelyek"></div>

                    <p id="kivalasztottHelyek">
                        Kiválasztott helyek: -
                    </p>
                </div>

                <div class="mb-3">
                    <label class="form-label">Összesen</label>
                    <input type="text" id="ar" class="form-control" readonly>
                </div>

                <button type="submit" class="foglalas-kuldes">
                    Foglalás létrehozása
                </button>
            </form>

            <div id="uzenet" class="mt-3"></div>
        </div>

        <div id="tablazatosNezet">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NÉV</th>
                        <th>FILM</th>
                        <th>IDŐPONT</th>
                        <th>ÜLŐHELY</th>
                        <th>JEGY</th>
                        <th>ÁR</th>
                        <th>MŰVELET</th>
                    </tr>
                </thead>

                <tbody id="foglalasTabla"></tbody>
            </table>
        </div>

        <div id="kartyasNezet" class="row" style="display: none;"></div>
    </div>

    <button id="felGomb" onclick="oldalTetejere()">↑</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="foglalasok.js"></script>
</body>
</html>
